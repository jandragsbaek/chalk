# Kamal 2: `kamal setup` once, then `kamal deploy`. See docs/deploy.md.
# The image goes through Kamal's local registry over SSH. The one secret, OPENROUTER_API_KEY, is
# on the VM in /etc/chalk/chalk.env (ansible); Kamal never sees it. See docs/deploy.md#secrets.
service: chalk
image: chalk

servers:
  # One process: the app RPC, the admin API and the SPA.
  web:
    hosts:
      - lab-chalk-01
    proxy:
      host: lab-chalk-01.llama-burbot.ts.net
      app_port: 4300
    # docker run --env-file: the coach's OpenRouter key, written by ansible. Must exist before a deploy.
    options:
      env-file: /etc/chalk/chalk.env

# Tailnet only: Chalk has no login. Caddy holds the Tailscale :443 and forwards to
# kamal-proxy on loopback. No ssl: here.
proxy:
  healthcheck:
    path: /
  run:
    bind_ips:
      - 127.0.0.1

registry:
  server: localhost:5555

# SQLite (WAL). A named volume takes /data's ownership (node) from the image.
volumes:
  - chalk_data:/data

builder:
  arch: amd64

ssh:
  user: semaphore
  # Fleet nodes' ansible key. Kamal's SSH (net-ssh) ignores ~/.ssh/config `Match user` blocks.
  keys:
    - ~/.ssh/t3code_ansible

aliases:
  logs: app logs -f
  shell: app exec --interactive --reuse "bash"
